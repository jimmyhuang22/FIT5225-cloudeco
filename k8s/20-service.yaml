apiVersion: v1
kind: Service
metadata:
  name: cloudeco-waste-api
  namespace: cloudeco
  labels:
    app: cloudeco-waste-api
    app.kubernetes.io/name: cloudeco-waste-api
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: cloudeco-waste-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
      nodePort: 30080
